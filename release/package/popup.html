<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sparx Study Assistant</title><style>
:root{color-scheme:light;--ink:#172b3a;--muted:#6d7c86;--line:#d8e1e4;--paper:#fff;--wash:#f5f7f5;--sage:#4d9461;--sage-soft:#edf6ef}body.dark{color-scheme:dark;--ink:#e6edf0;--muted:#a7b7bd;--line:#34474d;--paper:#1d292d;--wash:#131b1e;--sage:#77bd88;--sage-soft:#203a29}*{box-sizing:border-box}body{margin:0;width:360px;background:var(--wash);color:var(--ink);font:14px/1.35 "Segoe UI",system-ui,sans-serif}.head{padding:18px 18px 16px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border-radius:9px;background:var(--sage-soft);color:var(--sage);display:grid;place-items:center;font-size:20px;font-weight:700}.head h1{margin:0;font-size:17px;letter-spacing:-.2px}.head p{margin:3px 0 0;color:var(--muted);font-size:11px}.gear{margin-left:auto;color:var(--muted);font-size:18px}.status{margin:14px 16px 10px;padding:11px 12px;border:1px solid #cfe2d3;border-radius:9px;background:var(--sage-soft);display:flex;align-items:center;gap:9px;color:#285c36;font-size:12px}.dot{width:9px;height:9px;background:var(--sage);border-radius:50%}.status.busy{color:#49616a;background:#f1f5f5;border-color:var(--line)}.status.busy .dot{background:#9aaeb3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px 14px}.btn{min-height:68px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);cursor:pointer;text-align:left;padding:12px;font-weight:650;font-size:13px;transition:.15s}.btn span{display:block;margin-top:4px;color:var(--muted);font-size:11px;font-weight:400}.btn:hover{border-color:#9dbca4;background:#fbfefb}.btn.primary{border-color:#8eb69a;background:var(--sage-soft)}.btn.next{background:#f7faf8}.rule{height:1px;background:var(--line);margin:0 16px 14px}.preview{margin:0 16px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:13px}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.preview h2{margin:0;font-size:14px}.count{color:var(--muted);font-size:11px}.answer{border:1px solid #e3e9ea;border-radius:8px;padding:8px 9px;margin-top:7px;background:#fcfdfd}.answer label{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.answer strong{display:block;margin-top:4px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{color:var(--muted);font-size:12px}.tech{margin:0 16px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted);font-size:11px}.tech summary{padding:9px 10px;cursor:pointer}.out{margin:0;padding:10px;max-height:130px;overflow:auto;border-top:1px solid var(--line);background:var(--paper);color:var(--muted);font:11px ui-monospace,monospace;white-space:pre-wrap}.foot{padding:11px 16px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
</style></head><body><header class="head"><div class="mark">◒</div><div><h1>Sparx Study Assistant</h1><p>识别题目 · 解题 · 填写答案</p></div><button class="gear" id="theme" title="切换浅色/深色">◐</button></header><div id="status" class="status"><i class="dot"></i><span>已连接当前题目</span><b style="margin-left:auto;font-weight:500;color:#6d7c86">准备就绪</b></div><div class="grid"><button class="btn primary" id="read">读取并解题<span>识别题目并生成答案</span></button><button class="btn" id="fill">填入答案<span>将答案写到页面</span></button><button class="btn" id="state">识别状态<span>检查当前题目识别情况</span></button><button class="btn next" id="next">下一题<span>前往下一个题目</span></button></div><div class="rule"></div><section class="preview"><div class="preview-head"><h2>答案预览</h2><span class="count" id="count">暂无答案</span></div><div id="answers" class="empty">先点击“读取并解题”</div></section><details class="tech"><summary>技术详情</summary><pre id="out">等待操作…</pre></details><footer class="foot">ⓘ 仅在当前题目页运行 · Made by Samse</footer><script src="popup.js"></script></body></html>
